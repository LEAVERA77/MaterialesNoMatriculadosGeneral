name: Deploy to GitHub Pages

# El sitio es estático: `index.html` en la raíz del repo, sin build de Node.
#
# IMPORTANTE (23/11/2026): este repositorio quedó con Pages en modo
# "GitHub Actions" (build_type = workflow), no "Deploy from a branch".
# Eso significa que ESTE workflow es el único que publica el sitio:
# lo que no se copie a dist/ NO va a existir en la web.
# Si agregás imágenes, un favicon, un PDF o una carpeta de assets,
# sumala abajo (o copiá todo con el bloque opcional).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          set -e
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
          # Archivos opcionales, si existen
          [ -f favicon.ico ] && cp favicon.ico dist/ || true
          [ -f CNAME ] && cp CNAME dist/ || true
          [ -d assets ] && cp -r assets dist/ || true
          [ -d img ] && cp -r img dist/ || true
          echo "--- contenido de dist ---"
          find dist -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Aviso si el sitio no responde
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}")
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::El deployment fue exitoso pero el sitio no responde 200 todavía (propagación de CDN)."
